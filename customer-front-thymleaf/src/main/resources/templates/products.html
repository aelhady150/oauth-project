<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="template">
<head>
  <meta charset="UTF-8">
  <title>Customers</title>
  <link rel="stylesheet" href="/webjars/bootstrap/5.3.8/css/bootstrap.min.css">
</head>
<body>
<div layout:fragment="content">
  <div class="ps-3">
    <div class="card">
      <div class="card-body">
        <table class="table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Price</th>
              <th>Qte</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="p:${products}">
              <td th:text="${p.id}">ID</td>
              <td th:text="${p.name}">ID</td>
              <td th:text="${p.price}">ID</td>
              <td th:text="${p.quantity}">ID</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
</body>
</html>
