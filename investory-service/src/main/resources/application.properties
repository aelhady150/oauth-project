spring.application.name=investory-service
server.port=8098
spring.datasource.url=jdbc:h2:mem:products-db
spring.h2.console.enabled=true

logging.level.org.springframework.security=DEBUG

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/oauth-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/oauth-realm/protocol/openid-connect/certs